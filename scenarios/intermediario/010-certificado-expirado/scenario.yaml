apiVersion: incidente-zero/v1

id: 010-certificado-expirado
title: "Certificado TLS expirado em produção"
level: intermediario
track: web
estimated_minutes: 30
tags: [tls, https, certificado, openssl, nginx, systemd timer]

learning_objectives:
  - Ler um erro de TLS e identificar um certificado vencido
  - Inspecionar certificados com openssl (no disco e o que o servidor entrega)
  - Entender a cadeia de confiança de uma CA interna
  - Renovar um certificado e recarregar o servidor web sem derrubá-lo
  - Garantir que a renovação automática funcione de ponta a ponta

image: ghcr.io/sheila724/incidente-zero/lab-base:latest
hostname: loja-web-01
user: aluno
requires: []
resources:
  cpus: 0.5
  memory: 256m
  pids: 512
  mounts: []

alert:
  severity: alta
  source: monitoramento
  title: "Certificado TLS de loja.local expirado"
  briefing: briefing.md

content:
  concepts: conceitos.md
  hints: hints.yaml
  solution: solucao.md
  root_cause: causa-raiz.md
  references: referencias.md

scripts:
  setup: scripts/setup.sh
  inject: scripts/inject.sh
  check: scripts/check.sh
  solve: scripts/solve.sh     # solução de referência (iz selftest)

modes: [guiado, plantao]

guided:
  - title: Reproduza o erro
    text: "Teste como um cliente: `curl -v --resolve loja.local:443:127.0.0.1 https://loja.local/`. O que o curl diz sobre o certificado?"
  - title: Veja o certificado que o servidor entrega
    text: "Use `openssl s_client -connect 127.0.0.1:443 -servername loja.local </dev/null | openssl x509 -noout -subject -issuer -dates`."
  - title: Descubra por que não renovou
    text: "Algo deveria renovar esse certificado. Procure com `systemctl list-unit-files '*.timer'` e leia o serviço e o script que o timer chama (`systemctl cat`)."
  - title: Renove o certificado
    text: "Rode a renovação manualmente e confira as datas do arquivo novo com `openssl x509 -noout -dates -in /etc/ssl/loja/loja.crt`."
    verify: "openssl x509 -checkend 2592000 -noout -in /etc/ssl/loja/loja.crt"
  - title: Faça o nginx usar o certificado novo
    text: "O arquivo está renovado. O cliente já recebe o certificado novo?"
    verify: "curl -fs -o /dev/null -m 10 --resolve loja.local:443:127.0.0.1 https://loja.local/"
  - title: Conserte a renovação automática
    text: "Garanta que a próxima renovação aconteça sozinha e que o nginx passe a usar o certificado novo depois dela."
    verify: "systemctl is-active --quiet renova-certificado.timer && { grep -Eq '^[^#]*(systemctl +(reload|restart) +nginx|nginx +-s +reload)' /usr/local/sbin/renova-certificado || systemctl cat renova-certificado.service | grep -q '^ExecStartPost=.*nginx'; }"

scoring:
  base: 100
  time_bonus_minutes: 15
